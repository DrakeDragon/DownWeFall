html,body{margin:0;height:100%;background:#07030d;color:#fff;font-family:Georgia,serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
canvas{width:100%;height:auto;display:block;background:#000;border-bottom:2px solid #ff2bd6}

.lock{opacity:.25}
#pad.off .btn{display:none}
@media (orientation:landscape) and (max-height:520px){
 #wrap{max-width:none;flex-direction:row;position:relative}

<script>
(()=>{
const T=32,W=640,H=352;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const CY='#00e5ff',MG='#ff2bd6',GD='#ffd34d';
/* physics tuning: a little floatier than v2 */
const G_DOWN=.62,G_HOLD=.36,JUMP_V=9.4,MAX_FALL=10,RUN=3.3;

/* ---------- audio ---------- */
let ac=null;
function beep(f,d,type,vol,slide){
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
    g.gain.value=vol||.05;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
const mute=()=>SV&&SV.mute;
const S=(f)=>()=>{if(!mute())f()};
const sfx={jump:S(()=>beep(300,.2,'square',.045,260)),dbl:S(()=>beep(520,.18,'triangle',.05,420)),
 coin:S(()=>{beep(880,.08,'triangle',.05);setTimeout(()=>beep(1320,.12,'triangle',.05),70)}),
 stomp:S(()=>beep(160,.15,'sawtooth',.07,-90)),hurt:S(()=>beep(200,.4,'sawtooth',.08,-170)),
 grow:S(()=>beep(300,.4,'triangle',.07,500)),bump:S(()=>beep(120,.08,'square',.06)),
 slash:S(()=>beep(700,.1,'sawtooth',.04,-450)),dash:S(()=>beep(200,.15,'sawtooth',.05,500)),
 hit:S(()=>beep(240,.1,'square',.07,-120)),
 win:S(()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.07),i*110))),
 boom:S(()=>{beep(90,.5,'sawtooth',.09,-60);setTimeout(()=>beep(60,.4,'square',.08,-30),100)}),
 warp:S(()=>[300,450,600,900,1200].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.07),i*60))),
 shoot:S(()=>beep(520,.1,'square',.04,-300)),
 oneup:S(()=>[660,880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.07),i*80))),
 ui:S(()=>beep(660,.06,'triangle',.04)),buy:S(()=>{beep(990,.08,'triangle',.06);setTimeout(()=>beep(1480,.14,'triangle',.06),80)}),
 type:S(()=>beep(420+Math.random()*60,.03,'square',.012))};
/* procedural dark music, one key per realm */
let musT=null,musStep=0,musR=0;
const ROOTS=[110,98,123,87,104,117,92,131,82,139,100,73];
function musicStop(){if(musT){clearInterval(musT);musT=null}}
function musicStart(R){
  musicStop();musR=R;musStep=0;
  musT=setInterval(()=>{
    if(!ac||mute()||document.hidden)return;
    const root=ROOTS[musR%12],s=musStep++,sc=[0,3,5,7,10,12,15];
    if(s%4===0)beep(root*(s%16>=12?1.335:1),.5,'triangle',.028);
    const pat=[0,2,4,2,5,4,2,1,0,3,5,6,4,2,3,1];
    if(s%2===0)beep(root*2*Math.pow(2,sc[pat[(s>>1)%16]%7]/12),.15,'square',.01);
    if(s%8===6)beep(root*4*Math.pow(2,sc[(musR+s)%5]/12),.3,'sine',.008);
  },175-musR*3);
}

/* ---------- helpers ---------- */
function mkRng(s){s=(s>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}

/* ---------- persistent progress ---------- */
const ABIL=['dash','double','wall','wave','glide'];
const DRESSES=[{n:'Cyan',c:CY,cost:0},{n:'Magenta',c:MG,cost:200},{n:'Gold',c:GD,cost:400},{n:'Shadow',c:'#46306e',cost:600},{n:'Ghost',c:'#e8f4ff',cost:800},{n:'Rainbow',c:'rainbow',cost:1500}];
const DEF_SV=()=>({v:3,maxGi:0,cl:{},bank:0,up:{hp:0,blade:0,dash:0,mag:0,jump:0},dress:0,own:[1,0,0,0,0,0],abil:[0,0,0,0,0],seen:{},mute:0,ng:0,deaths:0,kills:0});
function loadSV(){try{const s=JSON.parse(localStorage.getItem('dwf3'));if(s&&s.v===3)return Object.assign(DEF_SV(),s)}catch(e){}return DEF_SV()}
let SV=loadSV();
function saveSV(){try{localStorage.setItem('dwf3',JSON.stringify(SV))}catch(e){}}
const has=n=>!!SV.abil[ABIL.indexOf(n)];

/* ---------- global state ---------- */
const buzz=n=>{try{if(!SV.mute&&navigator.vibrate)navigator.vibrate(n)}catch(e){}};
let paused=false;
let state='title',realm=0,stage=0,lvl=null,mainLvl=null,stash=null;
let cam=0,camY=0,frame=0,quip='',quipT=0,flash=0,fade=0,shake=0,hitstop=0,portalCool=0,banner=null,chk=null,combo=0,slowmo=0;
let stat={coins:0,total:0,deaths:0,dmg:0,t:0,got:new Set()};
const p={x:0,y:0,vx:0,vy:0,w:20,h:28,hp:3,maxHp:3,onG:false,face:1,inv:0,dead:0,anim:0,coyote:0,jbuf:0,jumps:0,dashT:0,dashCd:0,atkT:0,atkCd:0,wall:0,sx:1,sy:1,riding:null,safe:{x:64,y:200},swing:0,wcd:0,glide:false};
const parts=[],texts=[];
function say(t,d){quip=t;quipT=d||200}
function spawn(x,y,c,n,spd){spd=spd||4;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spd,vy:-Math.random()*spd,l:25+Math.random()*25,c})}
function popText(x,y,s,col){texts.push({x,y,s,col:col||'#fff',t:46})}

/* ---------- input ---------- */
const keys={l:0,r:0,j:0,a:0,d:0};let jumpP=false,atkP=false,dashP=false;
function setKey(k,v){
  if(v&&!keys[k]){if(k==='j')jumpP=true;if(k==='a')atkP=true;if(k==='d')dashP=true}
  keys[k]=v;
}
const KMAP={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j',z:'j',x:'a',j:'a',c:'d',k:'d',Shift:'d'};
addEventListener('keydown',e=>{const k=KMAP[e.key]||KMAP[e.key.toLowerCase&&e.key.toLowerCase()];if(k){setKey(k,1);e.preventDefault()}tap(null)});
addEventListener('keyup',e=>{const k=KMAP[e.key]||KMAP[e.key.toLowerCase&&e.key.toLowerCase()];if(k)setKey(k,0)});
function bindBtn(id,k){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();setKey(k,1);el.classList.add('on');tap(null)};
  const off=e=>{e.preventDefault();setKey(k,0);el.classList.remove('on')};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindBtn('bl','l');bindBtn('br','r');bindBtn('bj','j');bindBtn('ba','a');bindBtn('bd','d');
cv.addEventListener('pointerdown',e=>{
  if(document.documentElement.classList.contains('rot')){
    const lx=e.clientY,ly=innerWidth-e.clientX;
    tap({x:(lx-cv.offsetLeft)/cv.offsetWidth*W,y:(ly-cv.offsetTop)/cv.offsetHeight*H});
  }else{
    const r=cv.getBoundingClientRect();
    tap({x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H});
  }
  tryLandscape();
});
/* ---- landscape forcing ---- */
let lsTried=0;
function tryLandscape(){ // Android Chrome: fullscreen + orientation lock (needs a tap). iPhone can't lock, so the rotate fallback below handles it.
  if(lsTried>2)return;lsTried++;
  try{
    const de=document.documentElement,go=()=>{try{const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(p&&p.catch)p.catch(()=>{})}catch(e){}};
    if(de.requestFullscreen&&!document.fullscreenElement){const q=de.requestFullscreen();if(q&&q.then)q.then(go,go);else go()}else go();
  }catch(e){}
}
function fitOrient(){
  const de=document.documentElement,wrap=document.getElementById('wrap');if(!wrap)return;
  const touch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  const portrait=innerHeight>innerWidth;
  if(touch&&portrait){
    de.classList.add('rot');
    wrap.style.width=innerHeight+'px';wrap.style.height=innerWidth+'px';
    wrap.style.transform='translateX('+innerWidth+'px) rotate(90deg)';
  }else{
    de.classList.remove('rot');wrap.style.width='';wrap.style.height='';wrap.style.transform='';
  }
}
addEventListener('resize',fitOrient);addEventListener('orientationchange',()=>setTimeout(fitOrient,120));
fitOrient();
function syncPad(){const d=document.getElementById('bd');if(d)d.classList.toggle('lock',!has('dash'))}
/* ---------- realms ---------- */
// pal: sky[2], far, near, ground, top, brick, brickD, moon, spike, decor
const REALMS=[
{name:'THE RABBIT HOLE',sub:'Down. Always down.',sky:['#14052b','#07030d'],far:'#150727',near:'#1d0a35',ground:'#2d1450',top:'#ff2bd6',brick:'#4a2278',brickD:'#2a1048',moon:'#ff2bd6',spike:'#e8e8f0',decor:'mushroom',enemies:['card','card','bat'],
 intro:["Oh good, you're falling again. I do love a return customer.","Run, little Alice. The Queen has a list and you're on it."],

{name:'THE HALL OF DOORS',sub:'Every door is a mouth.',sky:['#021f2b','#010b10'],far:'#04323f',near:'#06495a',ground:'#0a3a4a',top:'#00e5ff',brick:'#0e5a6b',brickD:'#07303b',moon:'#99ffff',spike:'#ffd34d',decor:'door',enemies:['card','bat','hopper'],

 mini:{name:'THE KEY SPIRIT',kinds:['jumper'],col:'#ffd34d',col2:CY,skin:'ghost',hp:3,quip:"A tiny key with a very big grudge."}},
{name:'THE MAD TEA PARTY',sub:'The tea is cold. The guests are not.',sky:['#3b1a05','#120700'],far:'#4a2408',near:'#6b3510',ground:'#4a2a14',top:'#ffb347',brick:'#8a4a1c',brickD:'#4a250c',moon:'#ffd34d',spike:'#f4e4c8',decor:'cup',enemies:['card','hopper','bat','spitter'],
 intro:["It's always six o'clock here. Isn't that lovely? No? Good.","Sit. Sip. Scream. Order's up to you."],

{name:'THE POOL OF TEARS',sub:'Someone cried a flood. It was you.',sky:['#031a4a','#00040f'],far:'#052a6b',near:'#0a3d99',ground:'#0b2a66',top:'#4da6ff',brick:'#1a4fb0',brickD:'#0c2a66',moon:'#bfe0ff',spike:'#9fd0ff',decor:'wave',enemies:['bat','card','hopper'],

{name:"THE CATERPILLAR'S HAZE",sub:'Who are YOU? Nobody knows.',sky:['#1f2e05','#080d00'],far:'#33480a',near:'#4c6a10',ground:'#2f4a10',top:'#c6ff3d',brick:'#4f7a14',brickD:'#294208',moon:'#e0ff7a',spike:'#d8ffa0',decor:'mushroom',enemies:['card','hopper','spitter','bat'],
 intro:["Breathe in. Breathe out. Hear anything? That's the smoke talking.","Everything is the wrong size here. Including you."],

{name:"THE DUCHESS' KITCHEN",sub:'Pepper in the air. Pigs in the pot.',sky:['#3a0a0a','#100000'],far:'#4d1010',near:'#701818',ground:'#4a1414',top:'#ff5c3d',brick:'#8a2a1c',brickD:'#471008',moon:'#ffd0a0',spike:'#ffb38a',decor:'cup',enemies:['hopper','spitter','card','bat'],

{name:'THE CHESHIRE WOOD',sub:'The trees keep score.',sky:['#05261a','#010a07'],far:'#08402a',near:'#0c5e3c',ground:'#0a3a28',top:'#3dffb0',brick:'#14704a',brickD:'#093d28',moon:'#bffff0',spike:'#bffff0',decor:'tree',enemies:['bat','bat','card','spitter','hopper'],

{name:'THE PAINTED GARDEN',sub:'Paint the roses red. Use anything.',sky:['#3d0a2a','#12020c'],far:'#591040',near:'#801a5c',ground:'#4d1038',top:'#ff6fa8',brick:'#a02a70',brickD:'#541040',moon:'#ffd0e8',spike:'#ff9fc8',decor:'rose',enemies:['card','card','hopper','spitter'],

{name:'THE CROQUET GROUNDS',sub:'Flamingos for mallets. Hedgehogs for balls.',sky:['#0a3d14','#010f04'],far:'#0f5a1e',near:'#168a2e',ground:'#0d4a1a',top:'#ff3da8',brick:'#1f9a3a',brickD:'#0f5220',moon:'#ffffff',spike:'#ff3da8',decor:'hedge',enemies:['hopper','card','spitter','bat'],
 intro:["Play fair. Or don't. She cheats.","The hoops are alive. They're also hungry."],

function mkEnemy(cx,type){

  if(type==='spitter'||type==='lobber')e.vx=0;

  L.doorOpen=false;L.boss=mkBoss(R,bossKind,(w-8)*T);

function genNormal(R,st){
  const rng=mkRng(R*977+st*131+5);
  const diff=R*.55+st*.3;
  const chase=st===4;
  const w=(chase?150:112)+Math.floor(rng()*26)+R*5+st*6;
  const L=newLevel(w,chase?'chase':'normal');L.R=R;L.st=st;
  const g=L.g;groundFill(g,w);
  const pool=REALMS[R].enemies;
  const coin=(cx,cy)=>addCoin(L,cx,cy);
  const foe=(cx,t)=>L.en.push(mkEnemy(cx,t||pool[Math.floor(rng()*pool.length)]));
  const arenaLen=(st===3)?44:0;
  const endLimit=w-22-arenaLen;
  const wantSecret=(st===1||st===3),wantWarp=(st===3);
  let x=10,madeSecret=false,madeWarp=false,checkDone=false;
  while(x<endLimit){
    if(!checkDone&&x>endLimit*.45){g[8][x]='C';L.checkX=x*T;checkDone=true;x+=6;continue}
    if(wantSecret&&!madeSecret&&x>endLimit*.22){
      g[7][x+2]='B';g[7][x+3]='B';g[5][x+6]='B';g[5][x+7]='B';g[3][x+10]='B';g[3][x+11]='B';g[3][x+12]='B';
      g[2][x+11]='X';coin(x+2,6);coin(x+6,4);coin(x+9,2);
      foe(x+8,'bat');madeSecret=true;x+=18;continue;
    }
    if(wantWarp&&!madeWarp&&x>endLimit*.55){
      wallCol(g,x,8);wallCol(g,x+1,7);for(let i=2;i<5;i++)wallCol(g,x+i,6);wallCol(g,x+5,7);wallCol(g,x+6,8);
      g[5][x+3]='W';coin(x+1,6);coin(x+5,5);foe(x+9);madeWarp=true;x+=16;continue;
    }
    const r=rng();
    const hard=diff>3;
    if(r<.17){ // enemy run
      const n=1+Math.floor(rng()*(2+diff*.2));
      for(let i=0;i<n;i++)foe(x+3+i*4);
      for(let i=0;i<4;i++)coin(x+4+i,7);
      x+=n*4+9;
    }else if(r<.31){ // gap
      const gw=2+(rng()<.5?1:0);
      for(let i=0;i<gw;i++){g[9][x+i]=' ';g[10][x+i]=' '}
      for(let i=0;i<gw+1;i++)coin(x+i,6-(i===1?1:0));
      if(!chase&&rng()<.5)foe(x+gw+3);
      x+=gw+6;
    }else if(r<.42){ // spikes
      const n=1+Math.floor(rng()*3);
      for(let i=0;i<n;i++)g[8][x+i]='^';
      for(let i=0;i<n+2;i++)coin(x-1+i,6);
      x+=n+6;
    }else if(r<.52){ // stairs
      const h=1+Math.floor(rng()*3);
      for(let i=0;i<h;i++)wallCol(g,x+i,9-(i+1));
      wallCol(g,x+h,9-h);wallCol(g,x+h+1,9-h);
      for(let i=0;i<h;i++)wallCol(g,x+h+2+i,9-(h-i));
      coin(x+h,9-h-2);coin(x+h+1,9-h-2);
      if(!chase&&diff>2&&rng()<.6)foe(x+h*2+5);
      x+=h*2+8;
    }else if(r<.62){ // blocks
      const len=3+Math.floor(rng()*3);
      for(let i=0;i<len;i++)g[6][x+i]=(i%2===0)?'?':'B';
      for(let i=0;i<len;i++)coin(x+i,4);
      if(!chase&&rng()<.6)foe(x+len+1);
      if(!chase&&diff>3&&rng()<.5)foe(x+1,'bat');
      x+=len+8;
    }else if(r<.70){ // platform bridge
      const gw=6;
      for(let i=0;i<gw;i++){g[9][x+i]=' ';g[10][x+i]=' '}
      g[7][x+1]='B';g[7][x+2]='B';g[7][x+4]='B';g[7][x+5]='B';
      coin(x+1,6);coin(x+2,6);coin(x+4,6);coin(x+5,6);
      x+=gw+6;
    }else if(r<.78){ // spring tower
      g[8][x]='S';g[4][x+2]='B';g[4][x+3]='B';g[4][x+4]='?';g[4][x+5]='B';
      for(let i=0;i<4;i++)coin(x+2+i,3);coin(x,5);coin(x,3);
      if(!chase&&rng()<.5)foe(x+7);
      x+=10;
    }else if(r<.86){ // moving platform over a wide gap
      const gw=8;
      for(let i=0;i<gw;i++){g[9][x+i]=' ';g[10][x+i]=' '}
      L.mp.push({x:x*T+8,y:8*T,w:64,h:10,ox:x*T+8,oy:8*T,ax:(gw-2.5)*T,ay:0,sp:.035+rng()*.01,t:0,vx:0,vy:0});
      for(let i=0;i<4;i++)coin(x+1+i*1.6|0,6);
      x+=gw+6;
    }else if(r<.92){ // crumbling bridge
      const gw=5;
      for(let i=0;i<gw;i++){g[9][x+i]='Z';g[10][x+i]=' '}
      for(let i=0;i<gw;i++)coin(x+i,7);
      if(!chase&&hard&&rng()<.5)foe(x+gw+3,'bat');
      x+=gw+6;
    }else if(!chase){ // gauntlet / bat zone
      if(hard&&rng()<.6){
        foe(x+3);foe(x+7);g[8][x+5]='^';for(let i=0;i<5;i++)coin(x+3+i,5);x+=14;
      }else{
        const n=2+Math.floor(diff*.2);
        for(let i=0;i<n;i++)foe(x+3+i*3,'bat');
        for(let i=0;i<5;i++)coin(x+3+i,8);
        x+=n*3+8;
      }
    }else{x+=6}
  }
  if(!checkDone){g[8][endLimit-2]='C';L.checkX=(endLimit-2)*T}
  L.door=w-4;
  if(arenaLen)sealArena(L,g,w,arenaLen,'mini2',R);

function genArena(R,st,kind){ // kind: 'mini' | 'boss'
  const w=34,L=newLevel(w,kind);L.R=R;L.st=st;

  else{g[6][4]='B';g[6][5]='B';g[6][28]='B';g[6][29]='B';g[5][11]='B';g[5][12]='B';g[5][21]='B';g[5][22]='B';g[3][16]='B';g[3][17]='B';g[8][16]='S'}
  L.door=w-5;g[8][L.door]='D';L.doorOpen=false;
  L.arenaX=3*T;L.bx0=2*T;L.bx1=(w-3)*T;

function hitBoss(b,dmg,how){

function ledgeTurn(e){
  const ahead=Math.floor((e.x+(e.vx>0?e.w+2:-2))/T),below=Math.floor((e.y+e.h+4)/T);
  if(e.onG&&!solidAt(ahead,below))e.vx*=-1;
}
function explode(e){
  e.alive=false;shake=14;sfx.boom();spawn(e.x+12,e.y+12,'#ffb347',26,8);spawn(e.x+12,e.y+12,'#fff',10,5);
  if(Math.hypot((p.x+10)-(e.x+12),(p.y+14)-(e.y+12))<64)hurtPlayer(1,e.x);
  for(const o of lvl.en)if(o!==e&&o.alive&&o.type!=='dropper'&&Math.hypot(o.x-e.x,o.y-e.y)<56)hurtEnemy(o,1,'blast');
}
function updEnemy(e){
  if(!e.alive){e.squash++;return}
  if(e.flash>0)e.flash--;
  if(Math.abs(e.x-p.x)>W+80)return;
  e.t+=.05;
  const dx=(p.x+10)-(e.x+e.w/2),adx=Math.abs(dx),sgn=dx>0?1:-1;
  switch(e.type){
  case'bat':
    e.x+=e.vx;e.y=e.base-60+Math.sin(e.t*2)*40;
    if(Math.sin(e.t*.5)>.99)e.vx*=-1;
    if(solidAt(Math.floor((e.x+(e.vx>0?e.w:0))/T),Math.floor((e.y+12)/T)))e.vx*=-1;
    break;
  case'lantern':
    e.x+=e.vx;e.y=e.base+Math.sin(e.t*2.2)*20;
    if(solidAt(Math.floor((e.x+(e.vx>0?e.w:0))/T),Math.floor((e.y+12)/T))||Math.sin(e.t*.4)>.995)e.vx*=-1;
    if(--e.cd<=0&&adx<70&&p.y>e.y){lvl.proj.push({x:e.x+11,y:e.y+24,vx:0,vy:3.2,g:.04,r:5,life:140,col:'#ffd34d'});e.cd=95;sfx.shoot()}
    break;
  case'ghost':{
    const looking=(p.face>0&&dx>0)||(p.face<0&&dx<0);
    e.shy=looking;
    if(!looking&&adx<420){e.x+=sgn*.95;e.y+=((p.y-6)-e.y)*.02}
    e.y+=Math.sin(e.t*3)*.4;
    break}
  case'dropper':
    if(e.state==='hang'){if(adx<42&&p.y>e.y){e.state='fall';e.vy=0}}
    else if(e.state==='fall'){e.vy+=.8;e.y+=e.vy;if(e.y+e.h>=9*T){e.y=9*T-e.h;e.state='rise';e.cd=40;shake=6;sfx.bump();spawn(e.x+13,e.y+24,'#fff',6,3)}}
    else{if(--e.cd<=0){e.y-=2;if(e.y<=e.y0){e.y=e.y0;e.state='hang'}}}
    break;
  default:{
    e.vy+=.5;
    if(e.type==='card'||e.type==='hopper'||e.type==='knight'||e.type==='bomber'||e.type==='tumbler')ledgeTurn(e);
    if(e.type==='hopper'&&e.onG&&--e.cd<=0){e.vy=-8.5;e.cd=70}
    if(e.type==='knight'&&adx<160&&e.onG)e.vx=sgn*.6;
    if(e.type==='spitter'){e.vx=0;if(adx<320&&--e.cd<=0){lvl.proj.push({x:e.x+13,y:e.y+10,vx:sgn*2.4,vy:0,g:0,r:5,life:200,col:REALMS[realm].top});e.cd=110;sfx.shoot()}}
    if(e.type==='lobber'){e.vx=0;if(adx<380&&--e.cd<=0){lvl.proj.push({x:e.x+14,y:e.y,vx:clamp(dx/58,-3.4,3.4),vy:-6.8,g:.22,r:7,life:200,col:'#ff9f43'});e.cd=130;sfx.shoot()}}
    if(e.type==='bomber'){
      if(!e.fuse&&adx<260)e.vx=sgn*1.05;
      if(!e.fuse&&adx<62&&e.onG){e.fuse=55}
      if(e.fuse){e.fuse--;e.vx*=.9;if(e.fuse<=0){explode(e);return}}
    }
    moveBox(e,null);
  }}
  if(e.y>H+80)e.alive=false;
  if(ov(p,e)&&!p.dead){
    if(p.dashT>0){if(!(e.dh>frame-14)){e.dh=frame;hurtEnemy(e,1,'dash')}}
    else if(p.vy>0&&p.y+p.h-e.y<18&&e.type!=='dropper')hurtEnemy(e,2,'stomp');
    else hurtPlayer(1,e.x+e.w/2);
  }
}
function updProjectiles(){
  for(let i=lvl.proj.length-1;i>=0;i--){
    const q=lvl.proj[i];if(!q)continue;q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.life--;
    const hit={x:q.x-q.r,y:q.y-q.r,w:q.r*2,h:q.r*2};
    let dead=q.life<=0||q.y>H+40||q.x<-30||q.x>lvl.w*T+30||(!q.friendly&&solidAt(Math.floor(q.x/T),Math.floor(q.y/T)));
    if(q.friendly){
      for(const e of lvl.en)if(e.alive&&ov(hit,e)&&!(q.hits&&q.hits.has(e))){(q.hits=q.hits||new Set()).add(e);hurtEnemy(e,q.dmg||1,'wave');if(!q.pierce)dead=true}
      const b=lvl.boss;if(b&&b.alive&&b.active&&ov(hit,b)){hitBoss(b,1,'wave');if(!q.pierce)dead=true}
      if(solidAt(Math.floor(q.x/T),Math.floor(q.y/T)))dead=true;
    }else if(!dead&&ov(p,hit)&&!p.dead){hurtPlayer(1,q.x);dead=true}
    if(dead)lvl.proj.splice(i,1);
  }
}

function tap(pt){
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}

/* ---------- update ---------- */
function update(){
  frame++;
  if(quipT>0)quipT--;
  if(flash>0)flash--;
  if(shake>0)shake--;
  if(banner){banner.t--;if(banner.t<=0)banner=null}
  if(portalCool>0)portalCool--;
  for(const d of bgDust){d.y-=d.s*.3;d.x+=Math.sin(frame*.01+d.r)*.15;if(d.y<-4){d.y=H+4;d.x=Math.random()*W}}
  if(state==='story'&&story){const L=story.lines[story.i];if(story.n<L[1].length){story.n+=.9;if(frame%3===0)sfx.type()}return}
  if(state==='levelwin'||state==='end'){fade++;return}
  if(state!=='play')return;
  if(slowmo>0){slowmo--;if(frame&1)return}
  if(hitstop>0){hitstop--;return}
  stat.t++;

  if(p.dead){
    p.dead++;p.vy+=.5;p.y+=p.vy;
    if(p.dead>80){const q=pick(GEN_QUIPS.die);respawn();say(q,220)}
    return;
  }
  updMovingPlatforms();
  updPlayer();
  updCrumble();
  if(p.y>H+50&&!p.dead){
    if(p.hp<=1&&p.inv<=0&&p.dashT<=0)killPlayer();
    else{hurtPlayer(1);p.x=p.safe.x;p.y=p.safe.y;p.vx=p.vy=0;p.inv=Math.max(p.inv,90)}
  }
  if(lvl.chase&&!p.dead){
    const c=lvl.chase;if(c.wait>0)c.wait--;else c.x+=c.spd;
    if(p.x<c.x+34)killPlayer();
  }
  // tiles
  const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-1)/T),r=Math.floor((p.y+p.h-4)/T);
  const mid=Math.floor((p.x+10)/T),midR=Math.floor((p.y+14)/T);
  for(let tx=c0;tx<=c1;tx++){
    if(tileAt(tx,r)==='^'&&p.y+p.h>r*T+14)hurtPlayer(1);
    if(tileAt(tx,r)==='S'&&p.vy>=0&&p.y+p.h>r*T+10){p.vy=-14.8;p.sy=1.45;p.sx=.7;sfx.jump();spawn(tx*T+16,r*T+24,'#fff',6,3);p.jumps=has('double')?1:0}
  }
  const tc=tileAt(mid,midR);
  if(tc==='C'&&chk!==mid*T){chk=mid*T;sfx.coin();say(pick(GEN_QUIPS.check),160);spawn(mid*T+16,midR*T+8,CY,12);healPlayer(1)}
  if(portalCool===0&&!p.dead){
    if(tc==='X')enterRoom('bonus',mid*T,p.y);
    else if(tc==='W')enterRoom('warp',mid*T,p.y);
    else if(tc==='V'&&lvl.warps){
      const wp=lvl.warps.find(q=>q.x===mid*T);
      if(wp){sfx.warp();SV.maxGi=Math.max(SV.maxGi,wp.target*NSTAGES);SV.seen.warped=1;saveSV();beginStage(wp.target,0);return}
    }
  }
  const atDoor=tileAt(mid,midR)==='D'||tileAt(mid,midR+1)==='D';
  if(atDoor&&Math.abs((p.x+10)-(lvl.door*T+16))<22){
    if(lvl.isRoom){if(portalCool===0)exitRoom()}
    else if(lvl.doorOpen){finishStage();return}
  }
  if(lvl.boss&&lvl.boss.alive&&!lvl.boss.active&&lvl.arenaX!=null&&p.x>lvl.arenaX+((lvl.kind==='mini'||lvl.kind==='boss')?0:3*T))activateBoss();
  // pickups
  lvl.items.forEach((it,i)=>{
    if(it.got)return;
    if(it.pop){it.t=(it.t||0)+1;if(it.t<14){it.x+=it.vx||0;it.y+=it.vy||0;it.vy=(it.vy||0)+.2}else{const dx=p.x+10-it.x,dy=p.y+14-it.y,d=Math.hypot(dx,dy)||1;it.x+=dx/d*7.5;it.y+=dy/d*7.5}}
    else if(SV.up.mag>0){const dx=p.x+10-it.x,dy=p.y+14-it.y,d=Math.hypot(dx,dy)||1;if(d<24+SV.up.mag*34){it.x+=dx/d*4.5;it.y+=dy/d*4.5}}
    if(ov(p,it)){it.got=true;if(i<lvl.baseN)stat.got.add(i);gainCoin(1);sfx.coin();spawn(it.x+8,it.y+8,CY,5,3)}
  });
  if(lvl.bonus&&!lvl.paid&&lvl.items.every(i=>i.got)){lvl.paid=true;SV.bank+=100;popText(p.x,p.y-20,'+100 ⏱',GD);sfx.oneup();say(pick(GEN_QUIPS.life),200)}
  lvl.ents.forEach(e=>{
    e.vy+=.5;moveBox(e,null);
    if(e.vx===0&&e.onG)e.vx=1.2;
    if(!e.dead&&ov(p,e)){e.dead=true;healPlayer(1);addScore(150);spawn(p.x+10,p.y+10,MG,14)}
  });
  lvl.ents=lvl.ents.filter(e=>!e.dead&&e.y<H+80);
  const b=lvl.boss;
  if(b&&b.alive){
    updBoss(b);
    if(b.active&&ov(p,b)&&b.inv===0&&b.alpha>.6&&!p.dead){
      if(p.vy>0&&p.y+p.h-b.y<26)hitBoss(b,2,'stomp');
      else if(p.dashT<=0)hurtPlayer(1,b.x+b.w/2);
    }
  }
  updProjectiles();
  lvl.en.forEach(updEnemy);
  lvl.en=lvl.en.filter(e=>e.alive||e.squash<1);
  parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l--});
  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=.6;t.t--;if(t.t<=0)texts.splice(i,1)}
  for(let i=afterimg.length-1;i>=0;i--){afterimg[i].l--;if(afterimg[i].l<=0)afterimg.splice(i,1)}
  const target=clamp(p.x-W*.4+p.face*34,0,lvl.w*T-W);
  cam+=(target-cam)*.14;
}

/* ---------- drawing: world ---------- */
function drawDecor(type,x,base,h,r,col,k){
  ctx.fillStyle=col;
  switch(type){
  case'mushroom':
    ctx.fillRect(x+r-5,base-h,10,h);ctx.beginPath();ctx.ellipse(x+r,base-h,r+14,r*.7,0,Math.PI,0);ctx.fill();break;
  case'door':
    ctx.fillRect(x,base-h,r*1.4,h);ctx.beginPath();ctx.arc(x+r*.7,base-h,r*.7,Math.PI,0);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x+4,base-h+6,r*1.4-8,h-6);break;
  case'cup':
    ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x+r*2,base-h);ctx.lineTo(x+r*1.5,base);ctx.lineTo(x+r*.5,base);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=5;ctx.beginPath();ctx.arc(x+r*2,base-h*.6,r*.5,-1.2,1.2);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+r,base-h-4);ctx.quadraticCurveTo(x+r+8,base-h-18,x+r,base-h-32);ctx.stroke();break;
  case'wave':
    ctx.beginPath();ctx.ellipse(x+r,base,r+22,h*.5,0,Math.PI,0);ctx.fill();break;
  case'tree':
    ctx.fillRect(x+r-6,base-h,12,h);ctx.strokeStyle=col;ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(x+r,base-h*.6);ctx.lineTo(x-6,base-h*.95);ctx.moveTo(x+r,base-h*.7);ctx.lineTo(x+r*2+8,base-h*1.05);ctx.stroke();
    ctx.beginPath();ctx.arc(x+r,base-h-6,r+6,0,7);ctx.fill();break;
  case'rose':
    ctx.fillRect(x+r-2,base-h,4,h);ctx.beginPath();ctx.arc(x+r,base-h,r*.7,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.arc(x+r,base-h,r*.35,0,7);ctx.fill();break;
  case'hedge':
    ctx.fillRect(x,base-h,r*2.4,h);for(let i=0;i<4;i++)ctx.fillRect(x+i*r*.6,base-h-8,r*.4,8);break;
  case'spire':
    ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+r,base-h*1.3);ctx.lineTo(x+r*2,base);ctx.fill();break;
  case'heart':
    ctx.font=Math.round(h*.8)+'px Georgia';ctx.textAlign='left';ctx.fillText(k%2?'♥':'♠',x,base);break;
  }
}
/* ---------- background, lights, player ---------- */
function drawBG(R,camx,st,dim){

  const names=['RUN','SECRETS','MINI BOSS','WARP RUN','CHASE','BOSS'];
  pts.forEach((q,i)=>{
    const gi=R*NSTAGES+i,open=gi<=SV.maxGi,st=SV.cl[gi]||0,big=i===2||i===5;
    const r=big?30:26;
    if(open)glow(q.x,q.y,r+26,P.top,.35);
    ctx.fillStyle=open?'rgba(8,3,16,.9)':'rgba(30,30,40,.9)';ctx.beginPath();ctx.arc(q.x,q.y,r,0,7);ctx.fill();
    ctx.strokeStyle=open?(i===5?MG:i===2||i===3?GD:P.top):'#555';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=open?'#fff':'#555';ctx.font='bold '+(big?22:20)+'px Georgia';ctx.textAlign='center';ctx.fillText(open?icons[i]:'🔒',q.x,q.y+7);
    ctx.font='9px Georgia';ctx.fillStyle=open?'#cfc4e0':'#555';ctx.fillText(names[i],q.x,q.y+r+13);
    for(let s=0;s<3;s++)star(q.x-14+s*14,q.y+r+28,6,s<st);
    if(open)btns.push({x:q.x-r,y:q.y-r,w:r*2,h:r*2+40,fn:()=>{sfx.ui();beginStage(R,i)}});
  });
  if(R>0)button(8,200,36,60,'◀',CY,()=>{mapRealm--;musicStart(mapRealm)});
  if(R<unlockedR&&R<NREALMS-1)button(W-44,200,36,60,'▶',CY,()=>{mapRealm++;musicStart(mapRealm)});
  button(60,300,150,40,'SHOP',GD,()=>{state='shop'});
  button(430,300,150,40,'TITLE',MG,()=>goTitle());
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='10px Georgia';ctx.textAlign='center';
  ctx.fillText('★ clear   ★ 75% watches   ★ no deaths',W/2,326);
}
const UPS=[
 {k:'hp',n:'MORE HEARTS',d:'+1 max heart per level',c:[300,700,1400]},
 {k:'blade',n:'SHARPER BLADE',d:'More damage to bosses and foes',c:[400,900,1800]},
 {k:'dash',n:'QUICK DASH',d:'Dash recharges faster',c:[250,600,1200]},
 {k:'mag',n:'WATCH MAGNET',d:'Watches fly to you',c:[200,500,1000]},
 {k:'jump',n:'SPRING HEELS',d:'Jump a little higher',c:[250,600,1100]}
];
function drawShop(){
  drawBG(mapRealm,frame*.3,0,.55);
  ctx.fillStyle='rgba(8,3,16,.7)';ctx.fillRect(0,0,W,58);
  centerText("THE HATTER'S SHOP",30,24,GD);bankBadge();
  button(190,38,120,26,'UPGRADES',shopTab===0?CY:'#667',()=>{shopTab=0});
  button(330,38,120,26,'DRESSES',shopTab===1?CY:'#667',()=>{shopTab=1});
  if(shopTab===0){
    UPS.forEach((u,i)=>{
      const lv=SV.up[u.k],y=76+i*44,cost=u.c[lv],max=lv>=3;
      button(60,y,520,38,u.n,max?'#7dff9b':CY,()=>{if(!max&&SV.bank>=cost){SV.bank-=cost;SV.up[u.k]++;saveSV();sfx.buy()}},null,max||SV.bank<cost);
      ctx.textAlign='left';ctx.font='11px Georgia';ctx.fillStyle='#cfc4e0';ctx.fillText(u.d,70,y+31);
      for(let k=0;k<3;k++){ctx.fillStyle=k<lv?GD:'rgba(255,255,255,.2)';ctx.fillRect(430+k*16,y+10,12,12)}
      ctx.textAlign='right';ctx.font='bold 14px Georgia';ctx.fillStyle=max?'#7dff9b':SV.bank>=cost?GD:'#777';ctx.fillText(max?'MAX':'⏱ '+cost,572,y+24);
    });
  }else{
    DRESSES.forEach((d,i)=>{
      const x=40+(i%3)*190,y=82+Math.floor(i/3)*108,own=SV.own[i],eq=SV.dress===i;
      const col=d.c==='rainbow'?'hsl('+((frame*4)%360)+',90%,60%)':d.c;
      button(x,y,176,98,d.n,eq?'#7dff9b':own?CY:SV.bank>=d.cost?GD:'#666',()=>{
        if(own){SV.dress=i;saveSV();sfx.ui()}
        else if(SV.bank>=d.cost){SV.bank-=d.cost;SV.own[i]=1;SV.dress=i;saveSV();sfx.buy()}
      },eq?'EQUIPPED':own?'tap to wear':'⏱ '+d.cost);
      ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+88-14,y+80);ctx.lineTo(x+88-8,y+46);ctx.lineTo(x+88+8,y+46);ctx.lineTo(x+88+14,y+80);ctx.fill();
      ctx.fillStyle='#f2d3c4';ctx.fillRect(x+88-6,y+34,12,10);
    });
  }
  button(250,312,140,34,'BACK',MG,()=>{if(SV.seen.pro)goMap();else goTitle()});
}
function drawResults(){
  ctx.fillStyle='rgba(7,3,13,'+Math.min(.88,fade/40)+')';ctx.fillRect(0,0,W,H);
  if(fade<20||!res)return;
  centerText(res.boss?'REALM CLEARED':'STAGE CLEAR',70,32,CY);
  ctx.font='italic 14px Georgia';ctx.fillStyle='#fff';ctx.textAlign='center';
  wrapText(quip,440).forEach((l,i)=>ctx.fillText(l,W/2,96+i*18));
  const rows=[['Cleared',true],['75% of the watches  ('+stat.coins+' / '+stat.total+')',res.coinOK],['No deaths',res.noDeath]];
  rows.forEach((r,i)=>{const t=clamp((fade-30-i*14)/10,0,1);ctx.globalAlpha=t;star(190,150+i*32,13,r[1]);ctx.fillStyle=r[1]?'#fff':'#888';ctx.font='15px Georgia';ctx.textAlign='left';ctx.fillText(r[0],214,156+i*32);ctx.globalAlpha=1});
  ctx.textAlign='center';ctx.font='bold 14px Georgia';ctx.fillStyle=GD;ctx.fillText('+'+stat.coins+' ⏱  banked   ·   score '+(stat.score||0)+(res.newbest?'   ·   NEW BEST':''),W/2,262);
  if(fade>60){
    const last=stage===NSTAGES-1&&realm===NREALMS-1;
    button(110,282,190,44,last?'THE END':res.boss?'ON TO THE NEXT REALM':'NEXT STAGE',CY,()=>afterResults(true));
    button(340,282,190,44,'MAP',MG,()=>afterResults(false));
  }
}
function drawEnd(){
  drawBG(11,frame*.3,0,.6);
  ctx.fillStyle='rgba(7,3,13,.8)';ctx.fillRect(0,0,W,H);
  centerText('THE END',90,44,MG);
  ctx.font='italic 15px Georgia';ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText('The Queen is gone. The twelve Hours are home.',W/2,132);
  ctx.fillText('The hole is still there. It always will be.',W/2,156);
  ctx.fillStyle=CY;ctx.font='bold 14px Georgia';
  ctx.fillText('Foes felled: '+SV.kills+'    Falls: '+SV.deaths+'    Stages cleared: '+Object.keys(SV.cl).length+' / '+(NREALMS*NSTAGES),W/2,200);
  ctx.fillStyle=GD;ctx.fillText('NEW GAME + unlocked — bosses hit harder, and so does the dark.',W/2,230);
  if(fade>90&&Math.floor(frame/30)%2)centerText('tap to return to the title',290,16,CY);
}
function draw(){
  btns.length=0;
  if(state==='title'){drawTitle();return}
  if(state==='map'){drawMap();return}
  if(state==='shop'){drawShop();return}
  if(state==='story'){drawStory();return}
  if(state==='end'){drawEnd();return}
  drawWorld();
  drawHUD();drawBanner();
  if(quipT>0&&state==='play')drawBubble(quip);
  if(flash>0){ctx.fillStyle='rgba(255,43,214,'+flash/30+')';ctx.fillRect(0,0,W,H)}
  if(state==='levelwin')drawResults();
  if(paused&&state==='play')drawPause();
}
function drawPause(){
  btns.length=0;
  ctx.fillStyle='rgba(5,2,12,.82)';ctx.fillRect(0,0,W,H);
  centerText('PAUSED',70,38,MG);
  ctx.font='italic 14px Georgia';ctx.fillStyle='#bbb';ctx.textAlign='center';
  ctx.fillText(REALMS[realm].name+'  -  stage '+(stage+1)+' of '+NSTAGES,W/2,98);
  button(220,118,200,38,'RESUME',CY,()=>{paused=false});
  button(220,164,200,34,'RESTART STAGE',GD,()=>{paused=false;beginStage(realm,stage)});
  button(220,206,200,34,'WORLD MAP',MG,()=>{paused=false;goMap()});
  button(220,248,200,34,SV.mute?'SOUND: OFF':'SOUND: ON',CY,()=>{SV.mute=SV.mute?0:1;saveSV();if(SV.mute)musicStop()});
}
let last=0,accum=0,padOn=true;
function raf(t){
  accum+=Math.min(100,t-last);last=t;
  if(paused){accum=0}else while(accum>=16.67){update();accum-=16.67}
  const want=(state==='play'&&!paused);if(want!==padOn){padOn=want;try{document.getElementById('pad').classList.toggle('off',!want)}catch(e){}}
  draw();requestAnimationFrame(raf);
}
addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P'||e.key==='Escape')&&state==='play'){paused=!paused;keys.l=keys.r=keys.j=keys.a=keys.d=0}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){paused=true;keys.l=keys.r=keys.j=keys.a=keys.d=0}});
lvl=newLevel(40,'title');groundFill(lvl.g,40);syncPad();
requestAnimationFrame(raf);
})();
</script>
</body>
